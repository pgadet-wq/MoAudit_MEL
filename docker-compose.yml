# MoAudit_MEL - Docker Compose
# =============================
# Usage: docker compose up -d

services:
  moaudit-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moaudit-mel
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist outputs and uploads
      - ./outputs:/app/outputs
      - ./data/uploads:/app/data/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - moaudit-api

networks:
  default:
    name: moaudit-network
