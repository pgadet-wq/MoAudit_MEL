# MoA_MEL - Docker Compose
# =========================
# Orchestration pour déploiement local ou Scaleway

version: '3.8'

services:
  # Application principale - MEL Audit / IOSA Parser Viewer
  moamel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moamel-app
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PORT=8080
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=moa_mel
      - PG_USER=postgres
      - PG_PASSWORD=${PG_PASSWORD:-moamel_secure_pwd}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - moamel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Base de données PostgreSQL avec pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moamel-postgres
    environment:
      - POSTGRES_DB=moa_mel
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_PASSWORD:-moamel_secure_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${PG_EXTERNAL_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - moamel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moa_mel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy (optionnel, pour production)
  nginx:
    image: nginx:alpine
    container_name: moamel-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - moamel
    restart: unless-stopped
    networks:
      - moamel-network
    profiles:
      - production

networks:
  moamel-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
